services:
  mongo:
    image: mongo:latest
    container_name: samagama-mongo
    ports:
      - "27017:27017"
    volumes:
      - samagama_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: node:20-alpine
    container_name: samagama-server
    working_dir: /app
    volumes:
      - .:/app
      - samagama_node_modules:/app/node_modules
    ports:
      - "3001:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/samagama_navigator
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-demo-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-demo-refresh-secret-change-before-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    command: sh -c "npm install && npm run dev:server"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    image: node:20-alpine
    container_name: samagama-client
    working_dir: /app
    volumes:
      - .:/app
      - samagama_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    command: sh -c "npm install && npm run build --workspace client && npm run preview --workspace client -- --host 0.0.0.0 --port 5173"
    depends_on:
      - server

volumes:
  samagama_mongo_data:
  samagama_node_modules:
