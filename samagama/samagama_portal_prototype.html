  const nav=NAV[STATE.role];
  const h=n=>`<button class="s-item${n.id===STATE.screen?' active':''}" onclick="navigate('${n.id}')"><span class="s-item-icon">${n.icon}</span><span class="s-item-label">${n.label}</span>${n.badge?'<span class="s-item-badge">'+n.badge+'</span>':''}</button>`;
  document.getElementById('s-nav').innerHTML=nav.map(h).join('');
  const u=USER_INFO[STATE.role];
  document.getElementById('s-avatar').textContent=u.init;
  document.getElementById('s-user-name').textContent=u.name;
  document.getElementById('s-user-role').textContent=u.role;
  document.querySelectorAll('.s-role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===STATE.role));
}

function renderPage(){
  const map={
    home:pageHome,faqs:pageFaqs,ask:pageAsk,community:pageCommunity,
    'my-q':pageMyQ,chatbot:pageChatbot,recent:pageRecent,
    'mod-home':pageModHome,pending:pagePending,flagged:pageFlagged,
    unresolved:pageUnresolved,dupes:pageDupes,
    'admin-home':pageAdminHome,'faq-mgmt':pageFaqMgmt,categories:pageCategories,
    tags:pageTags,users:pageUsers,'mod-q':pageModQ,'bot-feedback':pageBotFeedback,
    settings:pageSettings,
  };
  const fn=map[STATE.screen];
  document.getElementById('content').innerHTML=fn?fn():'<div class="empty-state"><div class="empty-icon" style="font-size:36px">🚧</div><div class="empty-title">Coming Soon</div><div class="empty-sub">Part of the implementation roadmap</div></div>';
}

function navigate(id){STATE.screen=id;renderSidebar();renderPage();}

function switchRole(r){
  STATE.role=r;
  STATE.screen=DEFAULT_SCREEN[r];
  renderSidebar();
  renderPage();
}

function toggleSidebar(){
  STATE.sidebarOpen=!STATE.sidebarOpen;
  const sb=document.getElementById('sidebar');
  sb.classList.toggle('collapsed',!STATE.sidebarOpen);
  const brand=document.getElementById('s-brand');
  brand.classList.toggle('hide',!STATE.sidebarOpen);
  document.getElementById('s-brand-content').style.display=STATE.sidebarOpen?'':'none';
  document.getElementById('s-role').classList.toggle('hide',!STATE.sidebarOpen);
  document.querySelectorAll('.s-item-label,.s-item-badge').forEach(e=>e.style.display=STATE.sidebarOpen?'':'none');
  document.getElementById('s-user').style.display=STATE.sidebarOpen?'flex':'none';
}

function toggleTheme(){
  const app=document.getElementById('app');
  if(STATE.theme==='light'){
    STATE.theme='dark';
    app.classList.replace('light','dark');
    document.getElementById('theme-btn').innerHTML='☀️ Light';
  }else{
    STATE.theme='light';
    app.classList.replace('dark','light');
    document.getElementById('theme-btn').innerHTML='🌙 Dark';
  }
}
